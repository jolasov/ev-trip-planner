<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f0f0f0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EV Trips" />
    <title>EV Trip Planner</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css?v=11" />
  </head>
  <body>
    <div id="app">
      <nav class="tabs-bar">
        <div class="tabs">
          <button id="tab-plan" class="tab active" type="button">Plan</button>
          <button id="tab-saved" class="tab" type="button">Saved</button>
        </div>
        <span id="app-version" class="app-version"></span>
      </nav>

      <main id="main"><p class="boot-msg">Loading…</p></main>

      <nav id="bottom-nav" class="bottom-nav hidden" aria-label="Plan actions">
        <div class="bottom-row">
          <button id="commit-btn" class="primary-btn" type="button" disabled>Maps</button>
          <button id="save-plan-btn" class="secondary-btn" type="button">Save</button>
        </div>
      </nav>
    </div>

    <button id="scroll-top-btn" class="fab hidden" type="button" aria-label="Back to top">↑</button>

    <div id="loading" class="loading hidden" aria-live="polite">
      <div class="spinner"></div>
      <p class="loading-text">Working…</p>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>

    <script>
      (function () {
        var key = "ev-sw-reset-v12";
        if (!("serviceWorker" in navigator) || localStorage.getItem(key)) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) {
            localStorage.setItem(key, "1");
            return;
          }
          Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
            localStorage.setItem(key, "1");
            if (navigator.serviceWorker.controller) location.reload();
          });
        });
      })();
    </script>
    <script type="module" src="js/app.js?v=14"></script>
  </body>
</html>
