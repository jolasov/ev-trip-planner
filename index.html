<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f7fa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EV Trips" />
    <title>EV Trip Planner</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <nav class="tabs">
        <button id="tab-plan" class="tab active" type="button">Plan</button>
        <button id="tab-saved" class="tab" type="button">Saved</button>
      </nav>

      <main id="main"></main>

      <nav id="bottom-nav" class="bottom-nav hidden">
        <button id="commit-btn" class="primary-btn" type="button" disabled>
          Open in Google Maps
        </button>
        <button id="save-plan-btn" class="secondary-btn full-width" type="button" style="margin-top:8px">
          Save plan
        </button>
      </nav>
    </div>

    <div id="loading" class="loading hidden" aria-live="polite">
      <div class="spinner"></div>
      <p class="loading-text">Working…</p>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>

    <script type="module" src="js/app.js?v=5"></script>
  </body>
</html>
